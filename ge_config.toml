# Multiplayer menu transition: the original instruction is `bc 20,lt`, whose
# BO=20 encoding is an unconditional branch. ReXGlue 0.8 leaves this specific
# form unimplemented, so replace it with an explicit jump to its target.
[[midasm_hook]]
address = 0x820F2838
name = "ge_fix_mp_menu_branch"
registers = []
after_instruction = false
jump_address = 0x820F285C

