# The retail startup routine caches the display dimensions in its stack frame,
# then calls a long chain of graphics initializers before using those values to
# create the scene/depth resolve textures. In the recompiled path those two
# stack slots are clobbered to 0/-1, producing 8192x8191 sentinel fetches whose
# color and depth allocations overlap. Reload the same canonical display globals
# immediately before sub_82099B40 consumes r3/r4.
[[midasm_hook]]
address = 0x821899E4
name = "ge_fix_postfx_resolve_dimensions"
registers = ["r3", "r4"]
after_instruction = true

